
name: Download BRCA1 MAVE Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download BRCA1 scores
        run: python scripts/01_data_acquisition.py

      - name: Upload downloaded dataset
        uses: actions/upload-artifact@v4
        with:
          name: BRCA1-E3-raw-data
          path: data/raw/BRCA1_E3_scores.csv
          if-no-files-found: error
          retention-days: 30
