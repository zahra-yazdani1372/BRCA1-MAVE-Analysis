
name: BRCA1 MAVE Complete Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download BRCA1 MAVE data
        run: |
          python scripts/01_data_acquisition.py

      - name: Validate dataset
        run: |
          python scripts/02_data_validation.py

      - name: Run statistical analysis
        run: |
          python scripts/03_statistical_analysis.py

      - name: Upload project results
        uses: actions/upload-artifact@v4
        with:
          name: BRCA1-MAVE-Complete-Results
          path: |
            results/
            data/raw/BRCA1_E3_scores.csv
